<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي المربع - تحدي ثبات اليد</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #05070c;
      --card-bg: #0f131f;
      --accent-color: #00d2ff;
      --accent-hover: #00a8cc;
      --accent-glow: rgba(0, 210, 255, 0.25);
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #262d40;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; touch-action: none; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 28px; margin-bottom: 5px; color: var(--text-color); }
    header h1 span { color: var(--accent-color); }
    header p { color: var(--text-muted); font-size: 14px; }
    .game-container { background: var(--card-bg) !important; border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    canvas { background: #05070c; border: 2px dashed var(--border-color); border-radius: 15px; cursor: crosshair; display: block; margin-bottom: 20px; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .shake-animation { animation: shake 0.4s ease-in-out both; border-color: #ff4d4d !important; box-shadow: 0 0 20px rgba(255, 77, 77, 0.4); }
    .btn-group { display: flex; gap: 10px; width: 100%; }
    .action-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; background: var(--accent-color); color: #000000; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; }
    .action-btn:hover { background: var(--accent-hover); box-shadow: 0 4px 15px var(--accent-glow); color: #fff; }
    .action-btn.secondary { background: rgba(0, 210, 255, 0.08); color: var(--accent-color); border: 1px solid rgba(0, 210, 255, 0.3); }
    .action-btn.secondary:hover { background: var(--accent-color); color: #fff; }
    .result-box { margin-top: 15px; font-size: 18px; font-weight: 700; color: var(--accent-color); text-align: center; min-height: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>تحدي <span>المربع</span> 🟥</h1>
    <p>ارسم مربعاً بأسطح مستقيمة وزوايا متناسقة بلمسة واحدة</p>
  </header>
  <div class="game-container" id="gameBox">
    <canvas id="myCanvas" width="360" height="360"></canvas>
    <div class="result-box" id="resultText">ارسم مربعاً وابدأ التحدي</div>
    <div class="btn-group">
      <button class="action-btn secondary" onclick="clearCanvas()">إعادة المحاولة</button>
      <a href="main.html" class="action-btn secondary" style="background: rgba(255,255,255,0.02); color: #fff; border-color: var(--border-color);">الرئيسية</a>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const resultText = document.getElementById('resultText');
    const gameBox = document.getElementById('gameBox');

    let isDrawing = false;
    let points = [];
    let lastDrawingData = null;

    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function startDrawing(e) {
      e.preventDefault();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      points = [];
      lastDrawingData = null;
      isDrawing = true;
      resultText.innerText = "جاري الرسم...";
      gameBox.classList.remove('shake-animation');
      const pos = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      points.push(pos);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCoordinates(e);
      points.push(pos);

      ctx.strokeStyle = '#00d2ff';
      ctx.shadowColor = 'rgba(0, 210, 255, 0.5)';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      if (points.length < 20) {
        resultText.innerText = "الرسمة قصيرة جداً!";
        return;
      }
      lastDrawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      evaluateSquare();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resultText.innerText = "ارسم مربعاً وابدأ التحدي";
      gameBox.classList.remove('shake-animation');
      lastDrawingData = null;
    }

    function evaluateSquare() {
      let minX = points[0].x, maxX = points[0].x;
      let minY = points[0].y, maxY = points[0].y;
      
      points.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });

      let width = maxX - minX;
      let height = maxY - minY;
      let centerX = minX + width / 2;
      let centerY = minY + height / 2;
      let sideLength = (width + height) / 2;

      let variance = 0;
      let pointsNearCorners = 0;
      let totalCornersChecked = 0;

      points.forEach(p => {
        let dx = Math.min(Math.abs(p.x - minX), Math.abs(p.x - maxX));
        let dy = Math.min(Math.abs(p.y - minY), Math.abs(p.y - maxY));
        let distToEdge = Math.min(dx, dy);
        variance += Math.pow(distToEdge, 2);

        // فحص ما إذا كانت النقاط تتركز في الزوايا الحادة للمربع أم تلتف بشكل دائري
        let cornerDist1 = Math.hypot(p.x - minX, p.y - minY);
        let cornerDist2 = Math.hypot(p.x - maxX, p.y - minY);
        let cornerDist3 = Math.hypot(p.x - minX, p.y - maxY);
        let cornerDist4 = Math.hypot(p.x - maxX, p.y - maxY);
        
        let minDistToAnyCorner = Math.min(cornerDist1, cornerDist2, cornerDist3, cornerDist4);
        if (minDistToAnyCorner < sideLength * 0.25) {
          pointsNearCorners++;
        }
        totalCornersChecked++;
      });

      let rms = Math.sqrt(variance / points.length);
      let score = Math.max(0, Math.min(100, Math.round(100 - (rms * 3.5))));

      // شرط صارم: إذا كان الشكل المرسوم دائرياً (أي تفتقر النقاط للزوايا الحادة الأربع للمربع)، يتم خفض النتيجة بقوة
      let cornerRatio = pointsNearCorners / totalCornersChecked;
      if (cornerRatio < 0.35) {
        score = Math.min(score, 30); // منع الحصول على نسبة عالية عند رسم دائرة في صفحة المربع
      }

      let aspectMismatch = Math.abs(width - height);
      if (aspectMismatch > 15) {
        score = Math.max(5, score - Math.round(aspectMismatch * 1.2));
      }

      let startPoint = points[0];
      let endPoint = points[points.length - 1];
      let closureDist = Math.hypot(startPoint.x - endPoint.x, startPoint.y - endPoint.y);
      if (closureDist > 25) {
        score = Math.max(10, score - 30);
      }

      resultText.innerText = `النتيجة النهائية: ${score}% (المربع الأخضر هو المثالي)`;

      if (lastDrawingData) { ctx.putImageData(lastDrawingData, 0, 0); }
      let half = sideLength / 2;
      let idealX = centerX - half;
      let idealY = centerY - half;

      ctx.beginPath();
      ctx.rect(idealX, idealY, sideLength, sideLength);
      ctx.strokeStyle = '#22c55e';
      ctx.shadowColor = 'rgba(34, 197, 94, 0.4)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      let currentBest = localStorage.getItem('squareBestScore') || 0;
      if (score > currentBest) { localStorage.setItem('squareBestScore', score); }

      if (score >= 85) {
        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      } else if (score < 50) {
        gameBox.classList.add('shake-animation');
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing, { passive: false });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    // إعلام السيرفر أن هذه صفحة الدائرة
    socket.emit('join_game', { game: 'square' });

    socket.on('draw_data', (data) => {
        if (data.type === 'start') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points = [];
            lastDrawingData = null;
            isDrawing = true;
            resultText.innerText = "جاري الرسم من الجوال...";
            gameBox.classList.remove('shake-animation');
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
            points.push({x: data.x, y: data.y});
        } else if (data.type === 'draw') {
            points.push({x: data.x, y: data.y});
            ctx.strokeStyle = '#00d2ff';
            ctx.shadowColor = 'rgba(0, 210, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
        } else if (data.type === 'clear') {
            clearCanvas();
        } else if (data.type === 'stop') {
            isDrawing = false;
            if (points.length >= 15) {
                lastDrawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                evaluateCircleStrict();
            }
        }
    });
</script>
</body>
</html>
